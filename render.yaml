services:
  - type: web
    name: ssf-eventstore-hub
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_IDLE_TIMEOUT_MINUTES
        value: "5"
